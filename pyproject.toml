[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphase"
version = "0.4.0"
description = "Aluminum microstructure phase segmentation and reproducible experiment pipeline"
requires-python = ">=3.10"
dependencies = ["torch>=2.7", "torchvision>=0.22", "numpy>=1.26,<3", "Pillow>=10,<13", "scipy>=1.11,<2", "pypdf>=5,<7", "segmentation-models-pytorch==0.5.0", "timm==1.0.15", "huggingface-hub==0.30.2"]

[project.scripts]
alphase = "alphase.__main__:main"

[tool.setuptools.packages.find]
include = ["alphase*"]
